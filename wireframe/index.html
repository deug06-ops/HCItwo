<style>
/* layout: header, then a horizontally scrolling strip of 390x844 phone screens, each labeled with its screen ID */
:root{--bg:#F4F0F7;--surface:#FFFFFF;--fg:#2B2A27;--muted:#7D7A70;--line:#D9D5CD;--accent:#5E4E8E;--font:'Noto Sans KR',system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1D1C1A;--surface:#2A2926;--fg:#EEEBE5;--muted:#A8A498;--line:#3D3B36;--accent:#D49A6A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D1C1A;--surface:#2A2926;--fg:#EEEBE5;--muted:#A8A498;--line:#3D3B36;--accent:#D49A6A;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font)}
header{padding-block:24px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:22px;font-weight:900;text-wrap:balance}
header p{margin:0;font-size:13px;color:var(--muted);line-height:1.6;max-width:65ch}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
nav a{font-size:12px;color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px}
nav a:hover,nav a:focus-visible{border-color:var(--accent);outline:none}
.strip{overflow-x:auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:28px;width:max-content}
figure{margin:0;display:flex;flex-direction:column;gap:10px;scroll-margin-left:16px}
figcaption{display:flex;align-items:baseline;gap:8px;font-size:13px}
figcaption b{color:var(--accent);font-variant-numeric:tabular-nums}
figcaption span{color:var(--muted);font-size:12px}
iframe{width:390px;height:844px;border:1px solid var(--line);border-radius:28px;background:#fff;display:block}
</style>
